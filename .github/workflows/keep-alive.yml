name: Keep API warm

# Pings the API every 10 minutes so Render's free tier doesn't sleep.
# Set the API_HEALTH_URL repository variable to change the target.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEALTH_URL: ${{ vars.API_HEALTH_URL || 'https://real-estate-listing-portal-riay.onrender.com/api/health' }}
    steps:
      - name: Ping health endpoint
        run: |
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 90 "$HEALTH_URL"; then
              echo
              echo "API is awake (attempt $attempt)."
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 15s..."
            sleep 15
          done
          echo "API did not respond after 3 attempts."
          exit 1
