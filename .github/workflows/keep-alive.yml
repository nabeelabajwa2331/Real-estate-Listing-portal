name: Keep API warm

# Render's free tier spins a web service down after ~15 minutes without
# traffic, and the next visitor waits 30-60 seconds for it to boot. Pinging the
# health endpoint every 10 minutes keeps the instance warm during the hours
# reviewers and users are most likely to visit.
#
# Notes:
# - GitHub runs scheduled workflows on a best-effort basis (delays of a few
#   minutes are normal), so this greatly reduces cold starts but cannot
#   guarantee zero. The client also shows a "waking up" notice and retries GETs.
# - One always-on free service uses ~744 of Render's 750 free instance-hours a
#   month. Narrow the cron hours below if you run other free services.
# - Override the target with the API_HEALTH_URL repository variable.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEALTH_URL: ${{ vars.API_HEALTH_URL || 'https://real-estate-listing-portal-riay.onrender.com/api/health' }}
    steps:
      - name: Ping health endpoint
        run: |
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 90 "$HEALTH_URL"; then
              echo
              echo "API is awake (attempt $attempt)."
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 15s..."
            sleep 15
          done
          echo "API did not respond after 3 attempts."
          exit 1
